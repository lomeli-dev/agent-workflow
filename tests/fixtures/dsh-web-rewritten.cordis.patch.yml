    - id: agent-workflow-mcp-serena
      name: '@deepseek-ai/dsh-mcp-client'
      disabled: !!js "!((n)=>{try{return
        JSON.parse(process.getBuiltinModule('node:fs').readFileSync(process.cwd\
        ()+'/.dsh/agent-workflow-mcp.json','utf8')).mcpServers[n]}catch{return
        undefined}})(\"aw-serena\")"
      config:
        serverName: aw-serena
        transport: stdio
        command: !!js "(((n)=>{try{return
          JSON.parse(process.getBuiltinModule('node:fs').readFileSync(process.c\
          wd()+'/.dsh/agent-workflow-mcp.json','utf8')).mcpServers[n]}catch{ret\
          urn undefined}})(\"aw-serena\")??{}).command??'false'"
